[package]
name = "maplike"
version = "0.9.1"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Derive macros for maplike."
repository = "https://codeberg.org/topola/maplike"
documentation = "https://docs.rs/maplike"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["undo", "redo", "rtree", "no_std"]
categories = ["data-structures", "gui", "no-std", "rust-patterns"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[features]
derive = ["maplike_derive"]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
maplike_derive = { version = "0.9", optional = true, path = "maplike_derive" }
rstar = { version = "0.12", optional = true }
stable-vec = { version = "0.4", optional = true }
thunderdome = { version = "0.6", optional = true }

[dev-dependencies]
stable-vec = "0.4"
thunderdome = "0.6"
rstar = "0.12"

[package.metadata.docs.rs]
cargo-args = ["--all-features", "-Zunstable-options", "-Zrustdoc-scrape-examples"]
